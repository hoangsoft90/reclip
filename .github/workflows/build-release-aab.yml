name: Build Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: "83793900"
      KEY_ALIAS: "reclip"
      KEY_PASSWORD: "83793900"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode release keystore
        run: |
          echo "Decoding keystore..."
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          chmod 600 /tmp/release.keystore
          echo "KEYSTORE_FILE=/tmp/release.keystore" >> $GITHUB_ENV
          keytool -list -keystore /tmp/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1 | head -5
        env:
          KEYSTORE_B64: 

      - name: Build release AAB (signed)
        run: |
          cd android
          for i in 1 2 3; do
            ./gradlew bundleRelease && break
            echo "Attempt $i failed, retrying..."
            sleep 10
          done

      - name: Find AAB file
        run: |
          echo "Searching for AAB files..."
          find . -name "*.aab" -type f 2>/dev/null
          ls -la build/app/outputs/bundle/release/ 2>/dev/null || echo "release bundle dir not found"

      - name: Verify AAB signing
        run: |
          AAB_FILE=$(find build -name "*.aab" -type f | head -1)
          if [ -n "$AAB_FILE" ]; then
            echo "AAB found: $AAB_FILE"
            echo "Size: $(du -h "$AAB_FILE" | cut -f1)"
          else
            echo "No AAB file found"
            exit 1
          fi

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: reclip-release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        run: |
          AAB_FILE=$(find build -name "*.aab" -type f | head -1)
          echo "## Release AAB Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**AAB artifact:** reclip-release-aab" >> $GITHUB_STEP_SUMMARY
          if [ -n "$AAB_FILE" ]; then
            echo "**Size:** $(du -h "$AAB_FILE" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Signing Info" >> $GITHUB_STEP_SUMMARY
          echo "- Alias: reclip" >> $GITHUB_STEP_SUMMARY
          echo "- Algorithm: RSA 2048-bit" >> $GITHUB_STEP_SUMMARY
          echo "- Validity: 25 years" >> $GITHUB_STEP_SUMMARY
