name: reclip
description: "Reclip — Save what you discover. Find it again."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  receive_sharing_intent: ^1.8.0
  cached_network_image: ^3.4.0
  go_router: ^14.2.0
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  android_intent_plus: ^5.1.0
  intl: ^0.19.0
  dio: ^5.7.0
  html: ^0.15.4
  connectivity_plus: ^6.0.5
  flutter_cache_manager: ^3.4.1
  # Phase 3
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
